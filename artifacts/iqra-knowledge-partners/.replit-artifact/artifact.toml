kind = "slides"
previewPath = "/iqra-knowledge-partners/"
title = "IQRA Knowledge Partnership"
version = "1.0.0"
id = "artifacts/iqra-knowledge-partners"
router = "path"

[[integratedSkills]]
name = "slides"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/iqra-knowledge-partners/" ]
localPort = 25751

[services.development]
run = "pnpm --filter @workspace/iqra-knowledge-partners run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/iqra-knowledge-partners", "run", "build" ]
publicDir = "artifacts/iqra-knowledge-partners/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25751"
BASE_PATH = "/iqra-knowledge-partners/"
