kind = "slides"
previewPath = "/iqra-pitch/"
title = "IQRA Investment Pitch"
version = "1.0.0"
id = "artifacts/iqra-pitch"
router = "path"

[[integratedSkills]]
name = "slides"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/iqra-pitch/" ]
localPort = 19002

[services.development]
run = "pnpm --filter @workspace/iqra-pitch run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/iqra-pitch", "run", "build" ]
publicDir = "artifacts/iqra-pitch/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19002"
BASE_PATH = "/iqra-pitch/"
